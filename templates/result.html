<!DOCTYPE html>
<html>
<head>

    <title>Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Analysis Result</h1>

    <div class="result">

        <p><b>Project:</b> {{ project }}</p>

        <p><b>Similarity:</b> {{ score }}%</p>

        <p><b>Status:</b> {{ result }}</p>

    </div>

    <br>

    <a href="/">
        <button>Check Another</button>
    </a>

</div>

</body>
</html>
